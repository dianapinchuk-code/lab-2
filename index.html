<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наші тарифи</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="pricing-section">
    <div class="pricing-container">
      
      <header class="section-header">
        <h1 class="section-title">Наші тарифи</h1>
        <p class="section-subtitle">Оберіть план, який найкраще підходить для ваших завдань</p>
      </header>

      <div class="pricing-grid">
        
        <article class="card">
          <div class="card-header">
            <span class="plan-name">BASIC</span>
            <div class="plan-price">
              <span class="amount">$10</span>
              <span class="period">/ month</span>
            </div>
          </div>
          <ul class="features-list">
            <li><span class="check">✓</span> 1 User</li>
            <li><span class="check">✓</span> 5GB Storage</li>
            <li><span class="check">✓</span> Basic Support</li>
          </ul>
          <button class="btn btn-outline">Select</button>
        </article>

        <article class="card card-active">
          <div class="badge">PRO • ACTIVE</div>
          <div class="card-header">
            <span class="plan-name">PRO</span>
            <div class="plan-price">
              <span class="amount">$29</span>
              <span class="period">/ month</span>
            </div>
          </div>
          <ul class="features-list">
            <li><span class="check">✓</span> 5 Users</li>
            <li><span class="check">✓</span> 50GB Storage</li>
            <li><span class="check">✓</span> Priority Support</li>
          </ul>
          <button class="btn btn-primary">Get Started</button>
        </article>

        <article class="card">
          <div class="card-header">
            <span class="plan-name">ENTERPRISE</span>
            <div class="plan-price">
              <span class="amount">$99</span>
              <span class="period">/ month</span>
            </div>
          </div>
          <ul class="features-list">
            <li><span class="check">✓</span> Unlimited</li>
            <li><span class="check">✓</span> 1TB Storage</li>
            <li><span class="check">✓</span> 24/7 Support</li>
          </ul>
          <button class="btn btn-outline">Contact</button>
        </article>

      </div>
    </div>
  </section>
</body>
</html>
